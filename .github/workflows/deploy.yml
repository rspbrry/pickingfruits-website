name: Website veröffentlichen (GitHub Pages)

# Läuft automatisch, sobald sich etwas im Ordner "site" ändert (Push auf main),
# oder von Hand über den Reiter "Actions" > "Run workflow".
# Es werden keine Zugangsdaten benötigt: GitHub veröffentlicht den Ordner selbst.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ordner "site" packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
